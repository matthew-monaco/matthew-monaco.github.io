<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Green_M.png">
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const items = document.querySelectorAll("details");

  items.forEach((item) => {
    item.addEventListener("click", (e) => {
      const isOpening = !item.open;

      if (isOpening) {
        items.forEach((other) => {
          if (other !== item) {
            other.open = false;
          }
        });
      }
    });
  });
});
</script>
  
<body>

<header class="site-header">

  <a class="site-title" href="/">
    Matthew Monaco <span class="nav-dot"></span> Composer
  </a>

  <hr class="divider" />

  <div class="nav-wrap">
    <nav class="site-nav">

      <a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
      <span class="nav-dot">▪</span>

      <a href="/about" class="nav-link {% if page.url contains 'about' %}active{% endif %}">About</a>
      <span class="nav-dot">▪</span>

     <div class="dropdown">
  <span class="nav-link">Works</span>

  <div class="dropdown-content">
    <a href="/works_chronological">Chronological</a>
    <a href="/works_by_instrumentation">By instrumentation</a>
  </div>
</div>

<span class="nav-dot">▪</span>

      <a href="/listen" class="nav-link {% if page.url contains 'listen' %}active{% endif %}">Listen</a>
      <span class="nav-dot">▪</span>

      <a href="/writings" class="nav-link {% if page.url contains 'writings' %}active{% endif %}">Writings</a>

    </nav>
  </div>

</header>

<main class="content">
