<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Green_M.png">
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const dropdown = document.querySelector(".works-dropdown");
  const toggle = document.querySelector(".works-toggle");

  toggle.addEventListener("click", (e) => {
    e.preventDefault();
    dropdown.classList.toggle("open");
  });

  // close on outside click
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target)) {
      dropdown.classList.remove("open");
    }
  });
});
</script>
  
<body>

<header class="site-header">

  <a class="site-title" href="/">
    Matthew Monaco <span class="nav-dot"></span> Composer
  </a>

  <hr class="divider" />

  <div class="nav-wrap">
    <nav class="site-nav">

      <a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
      <span class="nav-dot">▪</span>

      <a href="/about" class="nav-link {% if page.url contains 'about' %}active{% endif %}">About</a>
      <span class="nav-dot">▪</span>

      <div class="works-dropdown">
  <button class="nav-link works-toggle {% if page.url contains 'works' %}active{% endif %}" type="button">
    Works
  </button>

  <div class="works-menu">
    <a href="/works_chronological" class="works-item">Chronological</a>
    <a href="/works_by_instrumentation" class="works-item">By instrumentation</a>
  </div>
</div>

<span class="nav-dot">▪</span>

      <a href="/listen" class="nav-link {% if page.url contains 'listen' %}active{% endif %}">Listen</a>
      <span class="nav-dot">▪</span>

      <a href="/writings" class="nav-link {% if page.url contains 'writings' %}active{% endif %}">Writings</a>

    </nav>
  </div>

</header>

<main class="content">
  {{ content }}
</main>

<footer class="site-footer">

  <div class="socials">
    <a class="social-link" href="https://soundcloud.com/matthewtmonaco" target="_blank">
      <img src="/assets/soundcloud.png" alt="SoundCloud">
    </a>

    <a class="social-link" href="https://www.youtube.com/@matthewtmonaco" target="_blank">
      <img src="/assets/youtube.png" alt="YouTube">
    </a>

    <a class="social-link" href="https://open.spotify.com/artist/7c6dcoAhkkQznw76SGbMDu" target="_blank">
      <img src="/assets/spotify.png" alt="Spotify">
    </a>

    <a class="social-link" href="https://www.instagram.com/matthew.t.monaco" target="_blank">
      <img src="/assets/instagram.png" alt="Instagram">
    </a>

    <a class="social-link" href="https://linktr.ee/matthew.t.monaco" target="_blank">
      <img src="/assets/link.png" alt="Linktree">
    </a>
  </div>

  <hr class="divider" />
  
  <div class="footer-text">
    © Matthew Monaco. Updated August 2026.
  </div>

</footer>

</body>
</html>
