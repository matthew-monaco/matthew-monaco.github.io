<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <a class="site-title" href="/">
      Matthew Monaco <span class="dot">▪</span> Composer
    </a>

    <hr class="divider" />

    <!-- NAV -->
    <nav class="site-nav">
      <a href="/" class="nav-link">Home</a>
      <span class="nav-dot">▪</span>

      <a href="/about" class="nav-link">About</a>
      <span class="nav-dot">▪</span>

      <a href="/works" class="nav-link">Works</a>
      <span class="nav-dot">▪</span>

      <a href="/listen" class="nav-link">Listen</a>
      <span class="nav-dot">▪</span>

      <a href="/writings" class="nav-link">Writings</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <main class="content">
    {{ content }}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <hr>

    <style>
      details > summary {
        list-style: none;
        cursor: pointer;
        padding: 10px;
        border-radius: 6px;
        transition: .2s;
      }

      details > summary::-webkit-details-marker {
        display: none;
      }

      details > summary::marker {
        content: "";
      }

      details > summary:hover,
      details[open] > summary {
        background: #e6e6e6 !important;
        color: #000 !important;
      }
    </style>

    <style>
      .social-link img {
        width: 30px;
        transition: 0.2s;
      }

      .social-link img:hover {
        opacity: 0.85;
        transform: scale(1.05);
        filter: brightness(0) saturate(100%) invert(32%) sepia(60%) saturate(500%) hue-rotate(85deg);
      }
    </style>

    <div class="socials">
      <a class="social-link" href="https://soundcloud.com/matthewtmonaco" target="_blank">
        <img src="./soundcloud.png" alt="SoundCloud">
      </a>

      <a class="social-link" href="https://www.youtube.com/@matthewtmonaco" target="_blank">
        <img src="./youtube.png" alt="YouTube">
      </a>

      <a class="social-link" href="https://open.spotify.com/artist/7c6dcoAhkkQznw76SGbMDu" target="_blank">
        <img src="./spotify.png" alt="Spotify">
      </a>

      <a class="social-link" href="https://www.instagram.com/matthew.t.monaco" target="_blank">
        <img src="./instagram.png" alt="Instagram">
      </a>

      <a class="social-link" href="https://linktr.ee/matthew.t.monaco" target="_blank">
        <img src="./link.png" alt="Linktree">
      </a>
    </div>

    <br>

    <div class="footer-text">
      Official website of composer Matthew Monaco
    </div>

    <hr>
  </footer>

</body>
</html>
